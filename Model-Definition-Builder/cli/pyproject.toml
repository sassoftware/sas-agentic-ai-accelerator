[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sas-mdb"
# The version is the accelerator release; the single source is mdb/__init__.py
dynamic = ["version"]
description = "Model Definition Builder CLI for the SAS Agentic AI Accelerator - generates LLM and Embedding model definitions from a single manifest per model"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    # typer is on 0.x and a minor release can break mdb (0.29.0 did): a maintainer raises the bound after
    # the suites pass on the newer typer, and checks for one once a month (CONTRIBUTING.md, "The typer Bound")
    "typer>=0.12,<0.30",
    "rich>=13.0",
    "jinja2>=3.1",
    "pydantic>=2.5",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-xdist>=3.5"]
viya = ["sasctl>=1.10", "setuptools"]  # setuptools provides the distutils shim sasctl needs on Python 3.12+

[project.scripts]
mdb = "mdb.cli:main"

# Third-party provider adapters register under this entry-point group:
# [project.entry-points."mdb.providers"]
# myprovider = "my_package.adapter:MyAdapter"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "mdb.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
