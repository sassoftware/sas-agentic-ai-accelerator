    and 0.95 on CLINC150 - the best measured on many-option intent sets) and 0.83 on the 231 public JevBench
    tasks. Calibration error 0.05-0.11, median latency about 0.4 s, $0.018-0.125 per 1,000 calls. Caution:
    the vendor publishes its own results on the same datasets, so training contamination cannot be ruled
    out. Measured 2026-10-05/06 on about 50 examples per dataset, three runs each: a shortlist, not a
    ranking.'
