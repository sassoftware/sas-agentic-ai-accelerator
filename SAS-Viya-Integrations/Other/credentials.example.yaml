#
# A credentials manifest for `mdb credentials-apply --manifest`.
#
# It says WHO gets keys and WHERE THOSE KEYS COME FROM. It never contains a
# key itself — the values are read from the .env files it points at, which
# stay git-ignored. This file is meant to be committed and reviewed in a diff:
# who can call which provider is a decision worth seeing the history of.
#
#   mdb credentials-apply --manifest credentials.yaml --dry-run   # see the plan
#   mdb credentials-apply --manifest credentials.yaml             # do it
#   mdb credentials-report --manifest credentials.yaml            # who holds one
#
# Remember four things:
#   * A USER credential overrides a GROUP one. That is the mechanism for
#     "the department shares a key, except Ada who has her own quota".
#   * Writing a credential REPLACES it whole — each source file must carry
#     everything that identity should end up with.
#   * Creating the domain, or any group credential, needs SAS administrator
#     rights. Users may always write their own.
#   * A group credential is only found by a reader that asks for it:
#     GET /credentials/domains/{domain}/secrets?lookupInGroup=true. Without
#     the flag the service reports 404 for the CALLING USER even when their
#     group holds a perfectly good credential. Everything in this repository
#     passes it; anything you write against this domain must too, because
#     getting it wrong fails in the most misleading way available — the
#     rollout looks complete, `credentials-report` says the group holds the
#     credential, and every call behaves as though it did not.
#     (Verified on a live server 2026-08-05 by removing a real user
#     credential and watching the group take over.)

# The one domain the accelerator reads. Match the credentialDomain option set
# on the Prompt Builder and RAG Builder objects.
domain: agentic-ai-keys

# Where entries come from unless an identity names its own file. Relative
# paths resolve against THIS file.
source: ../../.env

identities:
  # Everyone who builds prompts gets every provider key in the .env.
  - type: group
    id: PromptEngineers

  # The RAG engineers need the vector stores, not the LLM providers. `only`
  # names entries as the DOMAIN spells them (OpenAI, PGVECTOR_RAG_PW), not as
  # the .env does (OPENAI_API_KEY) — an unknown name is refused rather than
  # quietly dropped.
  - type: group
    id: RAGEngineers
    only:
      - PGVECTOR_RAG_USER
      - PGVECTOR_RAG_PW
      - RAGSTORE_HOST
      - RAGSTORE_PORT
      - RAGSTORE_DB
      - RAGSTORE_SSLMODE

  # The service account a scheduled flow runs as. Without this, a job launched
  # in a context that runs servers as a service account resolves the domain as
  # THAT identity and finds nothing — see the Managing Credentials guide.
  - type: user
    id: sas-be-sa

  # A production key set for one team, from a different file.
  - type: group
    id: FraudAnalytics
    source: ../../envs/production.env
