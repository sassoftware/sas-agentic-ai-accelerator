  - path: RAG/jobs/Ingest-Documents.sas
    kind: file
    source: SAS-Viya-Integrations/RAG-Ingestion/Ingest-Documents.sas
  - path: RAG/jobs/Test-Retrieval.sas
    kind: file
    source: SAS-Viya-Integrations/RAG-Ingestion/Test-Retrieval.sas
  - path: RAG/models/retrieve_context.py
    kind: file
    source: SAS-Viya-Integrations/RAG/retrieve_context.py

  # ---- Logging and Monitoring -------------------------------------------------
  - path: Logging and Monitoring/LLM Usage Report
    kind: report
    checks:
      tables: [LLM_LOGS, PROMPT_EXPERIMENTS, LLM_FACT_SHEET, EMBEDDING_FACT_SHEET]
  - path: Logging and Monitoring/LLM - Log Parser.step
    kind: step
    source: SAS-Viya-Integrations/Custom-Steps/LLM - Log Parser.step
  - path: Logging and Monitoring/LLM - Get All Prompts.step
    kind: step
    source: SAS-Viya-Integrations/Custom-Steps/LLM - Get All Prompts.step
  - path: Logging and Monitoring/Log-Parser-Code.sas
    kind: file
    source: SAS-Viya-Integrations/Logging-Monitoring/Log-Parser-Code.sas
  - path: Logging and Monitoring/Get-All-Prompts.sas
    kind: file
    source: SAS-Viya-Integrations/Logging-Monitoring/Get-All-Prompts.sas
  - path: Logging and Monitoring/Link-Logs-To-Models.sas
    kind: file
    source: SAS-Viya-Integrations/Logging-Monitoring/Link-Logs-To-Models.sas
  - path: Logging and Monitoring/Build-RAG-Cost-View.sas
    kind: file
    source: SAS-Viya-Integrations/Logging-Monitoring/Build-RAG-Cost-View.sas
  - path: Logging and Monitoring/Load-Fact-Sheets.sas
    kind: file
    source: SAS-Viya-Integrations/Logging-Monitoring/Load-Fact-Sheets.sas

  # ---- Data: what the reports' tables are loaded from --------------------------
  - path: Data/llm_fact_sheet.csv
    kind: file
    source: LLM-Definitions/llm_fact_sheet.csv
  - path: Data/embedding_fact_sheet.csv
    kind: file
    source: Embedding-Definitions/embedding_fact_sheet.csv
  - path: Data/decision_fact_sheet.csv
    kind: file
    source: Decision-Definitions/decision_fact_sheet.csv
  - path: Data/ACCELERATOR_RELEASES.csv
    kind: file
    generated: release-table
  # Loads the four files above into CAS; it includes Load-Fact-Sheets.sas from
  # the folder Logging and Monitoring of the content root.
  - path: Data/Load-Accelerator-Tables
    kind: jobDefinition
    code: SAS-Viya-Integrations/Setup/Load-Accelerator-Tables.sas
    description: Loads the release table and the three fact sheets from the Data folder into CAS (promoted and saved).
    parameters:
      - {name: _action, type: character, default: execute}
      - {name: contentRoot, type: character, default: /SAS Agentic AI Accelerator, label: Content root}
      - {name: caslib, type: character, default: Public, label: CAS library}
      - {name: releaseTable, type: character, default: ACCELERATOR_RELEASES, label: Release table}

  # ---- Custom Steps -----------------------------------------------------------
  # Not listed, and so not shipped: `LLM - Get Prompt Experiments.step`, the
  # step of August 2024 that reads the Prompt-Experiment-Tracker.json of one
  # model. `LLM - Get All Prompts` (Logging and Monitoring) is the step that
  # pulls the experiments. The file stays in Custom-Steps/ of the repository;
  # tests/test_content_manifest.py names it as the one step that is not listed.
  - path: Custom Steps/LLM - List Available LLMs.step
    kind: step
    source: SAS-Viya-Integrations/Custom-Steps/LLM - List Available LLMs.step
  - path: Custom Steps/LLM - Get Options.step
    kind: step
    source: SAS-Viya-Integrations/Custom-Steps/LLM - Get Options.step
  - path: Custom Steps/LLM - Create LLM Call.step
    kind: step
    source: SAS-Viya-Integrations/Custom-Steps/LLM - Create LLM Call.step
  - path: Custom Steps/MM - Get All Repositories.step
    kind: step
    source: SAS-Viya-Integrations/Custom-Steps/MM - Get All Repositories.step
  - path: Custom Steps/MM - Get Projects in Repository.step
    kind: step
    source: SAS-Viya-Integrations/Custom-Steps/MM - Get Projects in Repository.step
  - path: Custom Steps/MM - Get Models in Project.step
    kind: step
    source: SAS-Viya-Integrations/Custom-Steps/MM - Get Models in Project.step
  - path: Custom Steps/MM - Get Model Information.step
    kind: step
    source: SAS-Viya-Integrations/Custom-Steps/MM - Get Model Information.step
