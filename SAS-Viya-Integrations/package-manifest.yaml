#
# What ships in the accelerator's SAS Content folder - the one list.
#
# `mdb content-deploy` brings a content folder to this list from the checkout,
# `mdb package-export` keeps exactly these objects of an export, and
# `mdb package-check` compares the transfer package named below with it.
# An object that is not listed here is not deployed, not exported and fails
# the check when it is found in the package.
#
# One entry per object: `path` below the content root, `kind`, and where the
# object comes from in the repository.
#
#   folder         only for an empty folder or a description - the folders of
#                  the entries below are implied
#   file           source: <repository path>      or
#                  generated: release-info | release-table   (mdb writes it)
#   step           source: <repository path of the .step file>; the last part
#                  of the path is the name the .step file holds
#   jobDefinition  code: <repository path of the program>   and / or
#                  form: <repository path of an HTML file>
#                  parameters: [{name, type, default, label, siteSetting}]
#                  description
#   report         no source (the package is its only one);
#                  checks: {optionSet: prompt-builder, tables: [...]}
#                  files: [{name, sha256}] - the files that are children of
#                  the report (its pictures); the hash is what the check
#                  compares, because their bytes are not in the repository
#
# A parameter with `siteSetting: true` holds a value of the site: the compute
# context a job runs in (_contextName), the content root it reads
# (contentRoot). The default is what a new job definition gets; on a site that
# has the job definition a deploy and an import leave the site's value alone,
# unless they are given one (--compute-context, --content-root). The package
# of a release holds the defaults.
#
# A path with Showcases, Example, a folder named generated or a name that
# starts with ZZ_VERIFY is refused: such content never ships.
version: 1
contentRoot: /SAS Agentic AI Accelerator
package: SAS-Viya-Integrations/SAS-Agentic-AI-Accelerator.json

entries:
  # ---- the first page, and the release of this folder ------------------------
  # Start Here writes one HTML page: the links and the installation check. It
  # reads release.json of the content root, so the page needs no checkout.
  # _output_type = html is what makes SAS Job Execution show what the program
  # writes to _webout as a page.
  - path: Start Here
    kind: jobDefinition
    code: SAS-Viya-Integrations/Setup/Start-Here.sas
    description: Start page of the SAS Agentic AI Accelerator - links to the reports and the guides, and an installation check. Reads only.
    parameters:
      - {name: _action, type: character, default: execute}
      - {name: _output_type, type: character, default: html}
      - {name: contentRoot, type: character, default: /SAS Agentic AI Accelerator, label: Content root}
      - {name: caslib, type: character, default: Public, label: CAS library of the report tables}
      - {name: casServer, type: character, default: cas-shared-default, label: CAS server}
      - {name: credentialDomain, type: character, default: agentic-ai-keys, label: Credential domain}
      - {name: repositoryName, type: character, default: LLM Repository, label: Model Manager repository}
      - {name: llmProject, type: character, default: LLM Model Project, label: Project of the LLM definitions}
      - {name: embeddingProject, type: character, default: Embedding Model Project, label: Project of the embedding model definitions}
      - {name: decisionProject, type: character, default: Decision Model Project, label: Project of the decision model definitions}
      - {name: computeContexts, type: character, default: "SAS Studio compute context|SAS Job Execution compute context", label: Compute contexts to look for}
      - {name: guideUrl, type: character, default: "https://sassoftware.github.io/sas-agentic-ai-accelerator", label: Address of the guides}
  - path: release.json
    kind: file
    generated: release-info

  # ---- Prompt Builder -------------------------------------------------------
  - path: Prompt Builder/Prompt Builder
    kind: report
    checks:
      optionSet: prompt-builder
      tables: [ACCELERATOR_RELEASES]
  - path: Prompt Builder/SAS-LLM-Prompt-Builder-UI
    kind: jobDefinition
    form: LLM-Prompt-Builder/dist/index.html
    description: Prompt Builder HTML code that is built from the SAS Agentic AI Accelerator repository.
    parameters:
      - {name: _contextName, type: character, default: SAS Studio compute context, label: Context Name}
      - {name: _action, type: character, default: "prompts,form,execute"}
  - path: Prompt Builder/Optimize-Prompt-DSPy
    kind: jobDefinition
    code: SAS-Viya-Integrations/Prompt-Optimization/Optimize-Prompt-DSPy.sas
    description: Optimize a Prompt Builder prompt with DSPy
    parameters:
      - {name: _action, type: character, default: execute}
  - path: Prompt Builder/Create-Optimization-Dataset.sas
    kind: file
    source: SAS-Viya-Integrations/Prompt-Optimization/Create-Optimization-Dataset.sas

  # ---- RAG: steps, rag_core, jobs, the retrieval model template ---------------
  - path: RAG/steps/RAG - List Documents.step
    kind: step
    source: SAS-Viya-Integrations/Custom-Steps/RAG - List Documents.step
  - path: RAG/steps/RAG - Extract Text.step
    kind: step
    source: SAS-Viya-Integrations/Custom-Steps/RAG - Extract Text.step
  - path: RAG/steps/RAG - Chunk Documents.step
    kind: step
    source: SAS-Viya-Integrations/Custom-Steps/RAG - Chunk Documents.step
  - path: RAG/steps/RAG - Enrich Chunks.step
    kind: step
    source: SAS-Viya-Integrations/Custom-Steps/RAG - Enrich Chunks.step
  - path: RAG/steps/RAG - Embed Chunks.step
    kind: step
    source: SAS-Viya-Integrations/Custom-Steps/RAG - Embed Chunks.step
  - path: RAG/steps/RAG - Load Vector Store.step
    kind: step
    source: SAS-Viya-Integrations/Custom-Steps/RAG - Load Vector Store.step
  - path: RAG/steps/RAG - Retrieve Context.step
    kind: step
    source: SAS-Viya-Integrations/Custom-Steps/RAG - Retrieve Context.step
  - path: RAG/steps/RAG - Register Setup.step
    kind: step
    source: SAS-Viya-Integrations/Custom-Steps/RAG - Register Setup.step
  - path: RAG/steps/RAG - Purge Documents.step
    kind: step
    source: SAS-Viya-Integrations/Custom-Steps/RAG - Purge Documents.step

  - path: RAG/rag_core/__init__.py
    kind: file
    source: SAS-Viya-Integrations/RAG/rag_core/__init__.py
  - path: RAG/rag_core/chunkers.py
    kind: file
    source: SAS-Viya-Integrations/RAG/rag_core/chunkers.py
  - path: RAG/rag_core/credentials.py
    kind: file
    source: SAS-Viya-Integrations/RAG/rag_core/credentials.py
  - path: RAG/rag_core/enrich.py
    kind: file
    source: SAS-Viya-Integrations/RAG/rag_core/enrich.py
  - path: RAG/rag_core/env.py
    kind: file
    source: SAS-Viya-Integrations/RAG/rag_core/env.py
  - path: RAG/rag_core/filters.py
    kind: file
    source: SAS-Viya-Integrations/RAG/rag_core/filters.py
  - path: RAG/rag_core/history.py
    kind: file
    source: SAS-Viya-Integrations/RAG/rag_core/history.py
  - path: RAG/rag_core/manifest.py
    kind: file
    source: SAS-Viya-Integrations/RAG/rag_core/manifest.py
  - path: RAG/rag_core/pricing.py
    kind: file
    source: SAS-Viya-Integrations/RAG/rag_core/pricing.py
  - path: RAG/rag_core/providers.py
    kind: file
    source: SAS-Viya-Integrations/RAG/rag_core/providers.py
  - path: RAG/rag_core/registration.py
    kind: file
    source: SAS-Viya-Integrations/RAG/rag_core/registration.py
  - path: RAG/rag_core/schema.py
    kind: file
    source: SAS-Viya-Integrations/RAG/rag_core/schema.py
  - path: RAG/rag_core/scr.py
    kind: file
    source: SAS-Viya-Integrations/RAG/rag_core/scr.py
  - path: RAG/rag_core/sources.py
    kind: file
    source: SAS-Viya-Integrations/RAG/rag_core/sources.py
  - path: RAG/rag_core/steps.py
    kind: file
    source: SAS-Viya-Integrations/RAG/rag_core/steps.py
  - path: RAG/rag_core/tokens.py
    kind: file
    source: SAS-Viya-Integrations/RAG/rag_core/tokens.py
  - path: RAG/rag_core/adapters/__init__.py
    kind: file
    source: SAS-Viya-Integrations/RAG/rag_core/adapters/__init__.py
  - path: RAG/rag_core/adapters/base.py
    kind: file
    source: SAS-Viya-Integrations/RAG/rag_core/adapters/base.py
  - path: RAG/rag_core/adapters/pgvector.py
    kind: file
    source: SAS-Viya-Integrations/RAG/rag_core/adapters/pgvector.py
  - path: RAG/rag_core/adapters/singlestore.py
    kind: file
    source: SAS-Viya-Integrations/RAG/rag_core/adapters/singlestore.py
  - path: RAG/rag_core/extractors/__init__.py
    kind: file
    source: SAS-Viya-Integrations/RAG/rag_core/extractors/__init__.py
  - path: RAG/rag_core/extractors/base.py
    kind: file
    source: SAS-Viya-Integrations/RAG/rag_core/extractors/base.py
  - path: RAG/rag_core/extractors/builtin.py
    kind: file
