name: Verify generated model definitions

# Definition folders managed by the Model Definition Builder commit their
# generated files alongside the definition.yaml manifest. This workflow guards
# against those assets drifting from their manifest: it re-renders every
# managed definition and fails if the committed files differ, and it runs the
# mdb test suite (generation determinism, fleet fidelity, template-subset lint).
#
# It also guards the exported transfer packages under SAS-Viya-Integrations/,
# which is why that path is watched here: an export always reintroduces the
# exporting deployment's hostname, and all but one occurrence is hidden inside
# zlib-compressed report content where no diff review will show it.

on:
  push:
    branches:
      - main
    paths:
      - "LLM-Definitions/**"
      - "Embedding-Definitions/**"
      - "Model-Definition-Builder/**"
      - "SAS-Viya-Integrations/*.json"
      - "SAS-Viya-Integrations/RAG/**"
      - "SAS-Viya-Integrations/Other/**"
      - ".github/workflows/verify-model-definitions.yml"
  pull_request:
    paths:
      - "LLM-Definitions/**"
      - "Embedding-Definitions/**"
      - "Model-Definition-Builder/**"
      - "SAS-Viya-Integrations/*.json"
      - "SAS-Viya-Integrations/RAG/**"
      - "SAS-Viya-Integrations/Other/**"
      - ".github/workflows/verify-model-definitions.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is what SAS Viya's compute Python ships; 3.12 covers the
        # setuptools/distutils shim sasctl needs on newer interpreters
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install mdb
        run: pip install -e "./Model-Definition-Builder/cli[dev]"
      - name: Drift gate - committed assets match their manifests
        run: mdb generate --all --check
      - name: Validate managed definitions
        run: mdb validate --all
      - name: Transfer packages name no environment
        run: mdb package-check
      - name: mdb test suite
        run: python -m pytest Model-Definition-Builder/cli/tests -q
      - name: RAG runtime test suite
        # rag_core is pure Python plus pandas; the store adapters and the
        # extractors skip their tests when the optional drivers are absent
        run: |
          pip install pandas requests pytest
          python -m pytest SAS-Viya-Integrations/RAG/tests -q
