# Keeps the three toolchains and the workflow actions current. Grouped so an
# update is one pull request per ecosystem per month rather than one per
# package; majors stay separate because two of them (Vite, Docusaurus) need
# the prebuilt Prompt Builder and the docs site rebuilt and checked by hand.
version: 2
updates:
  - package-ecosystem: npm
    directory: /LLM-Prompt-Builder
    schedule:
      interval: monthly
    groups:
      prompt-builder-minor:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: monthly
    groups:
      website-minor:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /Model-Definition-Builder/cli
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
